name: Rebase leave accrual

# One-time maintenance after the v4 entitlement change: rebuild every accrual entry on the new
# model (11 Privilege + 7 Sick per FY prorata; +1/month to a shared pool of 4 for interns).
# Ledgers written before v4 still hold the old 18-combined-Paid-Leave credits.
#
# Only system-generated entries are cleared — opening / accrual / expiry / clawback. Leave people
# actually took, and any manual Admin adjustment, are left untouched. Running it twice is safe.
#
# Uses the same SEED_DATABASE_URL secret as "Seed database", so it works while Render's free
# instance is asleep and needs no JOB_SECRET.
#
# Run it from the Actions tab → "Rebase leave accrual" → Run workflow, and type REBASE to confirm.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REBASE to confirm — this rewrites accrual entries on the live database'
        required: true
        default: ''

jobs:
  rebase:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.SEED_DATABASE_URL }}
    steps:
      - name: Check the confirmation and the database secret
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "REBASE" ]; then
            echo "::error title=Not confirmed::Type REBASE in the confirmation box to run this."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing secret::Set the SEED_DATABASE_URL repository secret (the Neon connection string)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace @hc/server
      - name: Ensure schema is applied (idempotent)
        run: npm run db:migrate:deploy --workspace @hc/server
      - name: Rebase accrual
        run: npm run db:rebase-accrual --workspace @hc/server
