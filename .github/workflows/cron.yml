name: Scheduled jobs

# Nightly at 00:00 IST (18:30 UTC): flag overdue campaigns, refresh the leaderboard,
# and post any due leave accrual (all idempotent + self-healing). Requires two repo
# secrets: API_URL (the Render base URL) and JOB_SECRET (matching the server env).
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Fire internal jobs
        env:
          API_URL: ${{ secrets.API_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
        run: |
          set -e
          for job in flag-overdue monthly-accrual nightly-leaderboard; do
            echo "→ $job"
            curl -fsS -X POST "$API_URL/api/v1/internal/jobs/$job" \
              -H "Authorization: Bearer $JOB_SECRET"
            echo
          done
